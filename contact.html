<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Contact - YeJun.Debug_Log</title>
    <link rel="stylesheet" href="style.css">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">YeJun.<span>Debug_Log</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects/index.html">Project</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <main class="contact-section" style="padding: 120px 10% 80px; max-width: 1000px; margin: 0 auto; min-height: 100vh;">
        <div class="board-header">
            <h2>Get In Touch</h2>
            <p>새로운 기술적 도전과 성장을 위한 기회를 기다립니다. 언제든 편하게 연락해 주세요!</p>
        </div>

        <div class="contact-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 50px;">
            
            <div class="contact-info">
                <h3 style="color: var(--primary-color); margin-bottom: 20px; font-size: 1.5rem;">Contact Info</h3>
                <ul style="list-style: none; padding: 0; color: var(--text-sub); line-height: 2.5;">
                    <li>📧 Email: <a href="yejun1348@gmail.com" style="color: var(--text-main); text-decoration: none;">your.email@gmail.com</a></li>
                    <li>💻 GitHub: <a href="https://github.com/SonorZ3ro" target="_blank" style="color: var(--text-main); text-decoration: none;">github.com/your-id</a></li>
                    <li>📝 Blog: <a href="#" style="color: var(--text-main); text-decoration: none;">준비 중</a></li>
                </ul>
            </div>

            <div class="contact-form-container">
                <form id="contact-form" class="contact-form">
                    <div class="input-group">
                        <input type="text" name="user_name" id="user_name" placeholder="성함 (Name)" required>
                    </div>
                    <div class="input-group">
                        <input type="email" name="user_email" id="user_email" placeholder="이메일 (Email)" required>
                    </div>
                    <div class="input-group">
                        <textarea name="message" placeholder="메시지를 남겨주세요." rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">메시지 보내기</button>
                </form>
            </div>
            
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
